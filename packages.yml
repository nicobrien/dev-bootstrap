---
# Required by the toolchains, editor configuration, and shell setup.
required_apt_packages:
  - build-essential
  - fd-find
  - fontconfig
  - gcc
  - git
  - make
  - ripgrep
  - unzip
  - zsh

# Install every package group listed below.
enabled_package_groups:
  - essentials
  - native_development
  - python
  - databases
  - networking
  - documentation
  - desktop_clipboard
  - virtualization
  - profiling
  - docker
  - dotnet
  - kubernetes

apt_package_groups:
  essentials:
    - ca-certificates
    - curl
    - jq
    - openssh-client
    - rsync
    - tmux
    - tree
    - xz-utils

  native_development:
    - clang
    - clang-format
    - cmake
    - gdb
    - pkg-config

  python:
    - python3
    - python3-dev
    - python3-venv

  databases:
    - postgresql
    - postgresql-contrib
    - sqlite3

  networking:
    - bind9-dnsutils
    - netcat-openbsd
    - nmap
    - tcpdump

  documentation:
    - graphviz
    - pandoc

  desktop_clipboard:
    - xclip

  virtualization:
    - virt-manager
    - qemu-system-x86
    - qemu-utils
    - libvirt-daemon-system
    - libvirt-clients

  profiling:
    - bpfcc-tools
    - bpftrace
    - sysstat

  # The playbook must configure the appropriate apt repositories first.
  docker:
    - docker-ce
    - docker-buildx-plugin
    - docker-compose-plugin
  dotnet:
    - dotnet-sdk-10.0
  kubernetes:
    - kubectl

# Node/npm will use nvm, as explicitly selected. Do not add nodejs/npm to apt.
node_install_method: nvm
nvm_version: v0.40.8
node_version: "24.22.1"
pnpm_version: "12.16.1"
# Select the minor channel appropriate for your Kubernetes clusters.
kubernetes_minor_version: v1.37

meslo_font_revision: "145eb9fbc2f42ee408dacd9b22d8e6e0e553f83d"
meslo_fonts:
  - name: MesloLGS NF Regular.ttf
    checksum: sha256:d97946186e97f8d7c0139e8983abf40a1d2d086924f2c5dbf1c29bd8f2c6e57d
  - name: MesloLGS NF Bold.ttf
    checksum: sha256:b6c0199cf7c7483c8343ea020658925e6de0aeb318b89908152fcb4d19226003
  - name: MesloLGS NF Italic.ttf
    checksum: sha256:6f357bcbe2597704e157a915625928bca38364a89c22a4ac36e7a116dcd392ef
  - name: MesloLGS NF Bold Italic.ttf
    checksum: sha256:56b4131adecec052c4b324efb818dd326d586dbc316fc68f98f1cae2eb8d1220

go_version: "1.27.3"
go_download_url: "https://go.dev/dl/go{{ go_version }}.linux-amd64.tar.gz"
go_download_checksum: "sha256:ecbadb99091a3f46e31f5f934b068b1864eafa7995211b39eaddf76996045fe5"
rustup_version: "1.29.1"
rustup_download_url: "https://static.rust-lang.org/rustup/archive/{{ rustup_version }}/x86_64-unknown-linux-gnu/rustup-init"
rustup_download_checksum: "sha256:dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71"
rust_toolchain: stable
nvim_version: "0.12.4"
nvim_download_url: "https://github.com/neovim/neovim/releases/download/v{{ nvim_version }}/nvim-linux-x86_64.tar.gz"
nvim_download_checksum: "sha256:012bf3fcac5ade43914df3f174668bf64d05e049a4f032a388c027b1ebd78628"
kickstart_repo: https://github.com/nvim-lua/kickstart.nvim.git
oh_my_zsh_repo: https://github.com/ohmyzsh/ohmyzsh.git
powerlevel10k_repo: https://github.com/romkatv/powerlevel10k.git
# Optional permissions changes; Docker group membership grants root-equivalent access.
docker_without_sudo: false
set_zsh_default: true

# Upstream archives above are pinned for Linux amd64; Rust stable is a moving channel.
